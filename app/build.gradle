plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub workflow from repo secrets).
// Without them, the release APK is signed with the debug key so the build still works.
def ksPath = System.getenv('QM_KEYSTORE')
def hasKeystore = ksPath != null && file(ksPath).exists()

android {
    namespace 'com.jeqvid.QuestManager'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jeqvid.QuestManager'
        minSdk 23
        targetSdk 34
        versionCode 32
        versionName '4.4'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(ksPath)
                storePassword System.getenv('QM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('QM_KEY_ALIAS')
                keyPassword System.getenv('QM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Lint still runs and reports problems, but only real compile errors stop the build.
    lint {
        abortOnError false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES']
        }
    }
}

// The ADB library pulls in its own BouncyCastle (jdk15on or jdk15to18 flavour depending on version).
// Force every BouncyCastle module onto one flavour + version so classes aren't duplicated.
def bcVersion = '1.81'
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        ['bcprov', 'bcpkix', 'bcutil'].each { m ->
            ['jdk15on', 'jdk18on'].each { flavour ->
                substitute module("org.bouncycastle:${m}-${flavour}") using module("org.bouncycastle:${m}-jdk15to18:${bcVersion}")
            }
        }
    }
}

dependencies {
    implementation "com.github.MuntashirAkon:libadb-android:${libadbVersion}"
    // TLS 1.3 + keying-material export needed for wireless debugging pairing
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    // Self-signed certificate for the app's ADB key
    implementation "org.bouncycastle:bcprov-jdk15to18:${bcVersion}"
    implementation "org.bouncycastle:bcpkix-jdk15to18:${bcVersion}"
    // Unpacks the .xz frida-server download
    implementation 'org.tukaani:xz:1.10'
}
