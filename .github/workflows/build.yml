name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "QM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: the APK will be signed with a debug key."
          fi

      - name: Build
        env:
          QM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Only these two libadb-android versions exist on JitPack; try the newest first.
        run: |
          for v in master-SNAPSHOT 1.0.1; do
            echo "::group::Trying libadb-android $v"
            if gradle assembleRelease -PlibadbVersion=$v; then
              echo "::endgroup::"
              echo "Built with libadb-android $v"
              echo "### Built with libadb-android $v" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::libadb-android $v did not work, trying the next one"
          done
          echo "::error::No libadb-android version worked. Send the log above to Claude."
          exit 1

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/QuestManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuestManager
          path: out/QuestManager.apk

      - name: Publish release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/QuestManager.apk
